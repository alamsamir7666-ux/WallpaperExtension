name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, ktlint & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # No-op when the runner's Android SDK is present (it normally is);
      # downloads a verification-only android.jar otherwise.
      - name: Ensure android.jar for d8
        run: ./tools/fetch_android_jar.sh

      - name: ktlint
        run: ./gradlew ktlintCheck --stacktrace

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Package & verify extension
        run: ./gradlew packageExtension verifyPackage --stacktrace

      # Re-runs, offline, every rule the host engine enforces at install and
      # load time plus the release-dex ABI audit (see tools/verify_package.py).
      - name: Verify package against host engine rules
        run: python3 tools/verify_package.py plugin/build/outputs/extension/cloudimage.wallpaperflare.zip

      # The repository index the app fetches when the user adds this repo
      # by URL; sha256/sizeBytes are the promise the installer verifies.
      - name: Generate repository index
        run: python3 tools/build_repo_index.py plugin/build/outputs/extension

      - name: Upload extension package
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: wallpaperflare-extension-package
          path: |
            plugin/build/outputs/extension/*.zip
            plugin/build/outputs/extension/index.json
